<!DOCTYPE HTML>
<html lang="pl">
<head>
	<meta charset="ISO-8859" />
	<meta http-equiv="X-UA-Compatible"/>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/match.css') }}">
	<script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
</head>

<body>
	<div id="matchdata" data-matchdata='{{ matchdata | tojson | safe }}' style="display: none;"></div>
	<div id="time-data" data-time-data='{{ time_data | tojson | safe }}' style="display: none;"></div>
	<div id="container">
		<div id="scoreboard">
			<div id="scoreboard_img" >
				<img src="{{url_for('static', filename='images/scoreboard2.png')}}" />
			</div>
			<div id="scoreboard_top">
				<div id="fouls-a-value"></div>
				<div id="fouls-b-value"></div>
			</div>
			<div id="scoreboard_val">
				<div id="time" class="stream-time-display"></div>
				<div id="team_a"></div>
				<div id="score-a-value"></div>
				<div id="score-b-value"></div>
				<div id="team_b"></div>
			</div>
			<div id="scoreboard_bottom">
				<div id="tricot_a">
					<div id="shade_a"></div>
					<div id="colors_a">

						<div class="cleaner"></div>
					</div>
				</div>
				<div id="tricot_b">
					<div id="shade_b"></div>
					<div id="colors_b">
					</div>
				</div>
			</div>
		</div>
		<div id="action_info">
			<div id="action_info_text">

            </div>
		</div>
	</div>



	<script src="{{url_for('static', filename='js/common.js')}}"></script>
	<script src="{{url_for('static', filename='js/timer-utils.js')}}"></script>
	<script src="{{url_for('static', filename='js/match.js')}}"></script>
	<script src="{{url_for('static', filename='js/socketio.js')}}"></script>
</body>
</html>
